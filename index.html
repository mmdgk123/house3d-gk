<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>خونه سه‌بعدی 🏠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#111;
    font-family:Tahoma,sans-serif; touch-action:none; overscroll-behavior:none; }
  #c { display:block; width:100%; height:100%; }
  #room { position:fixed; top:12px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.55); color:#ffd76a; padding:8px 22px; border-radius:99px;
    font-size:16px; z-index:10; pointer-events:none; white-space:nowrap; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.5); color:#fff; padding:7px 18px; border-radius:99px;
    font-size:12px; z-index:10; pointer-events:none; white-space:nowrap; }
  #map { position:fixed; top:12px; left:12px; z-index:10; border-radius:8px;
    border:2px solid rgba(255,255,255,.4); }
  #joy { position:fixed; bottom:70px; right:24px; width:124px; height:124px;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.35);
    border-radius:50%; z-index:10; touch-action:none; }
  #stick { position:absolute; left:37px; top:37px; width:50px; height:50px;
    background:rgba(255,215,106,.9); border-radius:50%; pointer-events:none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="map" width="120" height="90"></canvas>
<div id="room">پذیرایی 🏠</div>
<div id="hint">جوی‌استیک: حرکت &nbsp;|&nbsp; کشیدن صفحه: نگاه</div>
<div id="joy"><div id="stick"></div></div>
<script>
// نقشه خونه (هر خونه ۱ متر) — # دیوار، . خالی، بقیه مبلمان
var MAP = [
"############",
"#......#KKF#",
"#SS.T.V#...#",
"#......#...#",
"#......###.#",
"###.#......#",
"#....#..BB.#",
"#BB.D.#.W..#",
"######.#####"
];
var ROWS = MAP.length, COLS = MAP[0].length;

var COLORS = {
  '#':[233,224,203], 'S':[158,74,62],  'T':[178,120,62], 'V':[40,40,55],
  'K':[155,165,170], 'F':[224,228,231], 'B':[74,106,158], 'W':[116,79,47],
  'D':[146,114,72]
};

var cv = document.getElementById('c');
var ctx = cv.getContext('2d');
var vig = null;
function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  vig = ctx.createRadialGradient(
    cv.width/2, cv.height/2, Math.min(cv.width,cv.height)*0.35,
    cv.width/2, cv.height/2, Math.max(cv.width,cv.height)*0.75);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.45)');
}
addEventListener('resize', resize); resize();

var mapCv = document.getElementById('map');
var mctx = mapCv.getContext('2d');

var px = 0.5, pz = 3.0, ang = -Math.PI/2, PR = 0.22;

function solid(x, z) {
  var c = Math.floor(x + 6), r = Math.floor(z + 4.5);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  return MAP[r][c] !== '.';
}
function move(dx, dz) {
  if (!solid(px+dx, pz)) px += dx;
  if (!solid(px, pz+dz)) pz += dz;
}

function cast(rayA) {
  var dx = Math.cos(rayA), dz = Math.sin(rayA);
  var c = Math.floor(px+6), r = Math.floor(pz+4.5);
  var ddx = Math.abs(1/(dx||1e-9)), ddz = Math.abs(1/(dz||1e-9));
  var stepX, stepZ, sx, sz;
  if (dx < 0) { stepX=-1; sx=(px+6-c)*ddx; } else { stepX=1; sx=(c+1-(px+6))*ddx; }
  if (dz < 0) { stepZ=-1; sz=(pz+4.5-r)*ddz; } else { stepZ=1; sz=(r+1-(pz+4.5))*ddz; }
  var side=0, cell='#', guard=0;
  while (guard++ < 64) {
    if (sx < sz) { sx+=ddx; c+=stepX; side=0; } else { sz+=ddz; r+=stepZ; side=1; }
    if (c<0||r<0||c>=COLS||r>=ROWS) break;
    cell = MAP[r][c];
    if (cell !== '.') break;
  }
  var dist = Math.max((side===0 ? sx-ddx : sz-ddz), 0.05);
  var wallX = (side===0 ? (pz+4.5)+dist*dz : (px+6)+dist*dx);
  var fx = wallX - Math.floor(wallX);
  return { d: dist, side: side, cell: cell, fx: fx };
}

function rgb(c) { return 'rgb('+c[0]+','+c[1]+','+c[2]+')'; }
function mix(a, b, t) {
  return [Math.floor(a[0]+(b[0]-a[0])*t), Math.floor(a[1]+(b[1]-a[1])*t), Math.floor(a[2]+(b[2]-a[2])*t)];
}
function shade(base, f) {
  return [Math.floor(base[0]*f), Math.floor(base[1]*f), Math.floor(base[2]*f)];
}

var FOV = Math.PI/3;
var CEIL_TOP=[26,34,44], CEIL_BOT=[125,143,161];
var FL_TOP=[86,66,44], FL_BOT=[168,130,80];

function render() {
  var W = cv.width, H = cv.height, half = H/2, i, y0, y1;
  // سقف پلکانی (دور تیره، نزدیک روشن)
  var CB = 10;
  for (i=0; i<CB; i++) {
    y0 = half*i/CB; y1 = half*(i+1)/CB;
    ctx.fillStyle = rgb(mix(CEIL_TOP, CEIL_BOT, i/(CB-1)));
    ctx.fillRect(0, y0, W, y1-y0+1);
  }
  // کف پلکانی (دور تیره، نزدیک روشن)
  var FB = 22;
  for (i=0; i<FB; i++) {
    y0 = half + (H-half)*i/FB; y1 = half + (H-half)*(i+1)/FB;
    ctx.fillStyle = rgb(mix(FL_TOP, FL_BOT, i/(FB-1)));
    ctx.fillRect(0, y0, W, y1-y0+1);
  }

  var step = Math.max(1, Math.floor(W/500));
  for (var x=0; x<W; x+=step) {
    var rayA = ang - FOV/2 + FOV*x/W;
    var hit = cast(rayA);
    var d = hit.d * Math.cos(rayA - ang);
    var h = Math.min(H*3, H/d);
    var base = COLORS[hit.cell] || COLORS['#'];
    var sh = Math.max(0.22, 1/(1+d*0.28)) * (hit.side ? 0.7 : 1);
    // بافت: نوارهای عمودی + تیرگی لبه بلوک
    var band = (Math.floor(hit.fx*7)%2 === 0) ? 1 : 0.86;
    var edge = Math.min(hit.fx, 1-hit.fx);
    if (edge < 0.04) band *= 0.65;
    var mid = shade(base, sh*band);
    var top = shade(base, sh*band*0.62);
    var bot = shade(base, sh*band*0.45);
    var wy = half-h/2, th = h*0.07, bh = h*0.12;
    ctx.fillStyle = rgb(top); ctx.fillRect(x, wy, step+0.5, th);
    ctx.fillStyle = rgb(mid); ctx.fillRect(x, wy+th, step+0.5, h-th-bh);
    ctx.fillStyle = rgb(bot); ctx.fillRect(x, wy+h-bh, step+0.5, bh);
  }
  // وینیت + نقطه وسط
  ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = 'rgba(255,255,255,.7)';
  ctx.fillRect(W/2-1.5, H/2-1.5, 3, 3);
  drawMap();
}

function drawMap() {
  var s = 10;
  mctx.fillStyle = 'rgba(0,0,0,.6)'; mctx.fillRect(0,0,120,90);
  for (var r=0; r<ROWS; r++) for (var c=0; c<COLS; c++) {
    var ch = MAP[r][c];
    if (ch === '.') continue;
    mctx.fillStyle = rgb(COLORS[ch] || COLORS['#']);
    mctx.fillRect(c*s, r*s, s, s);
  }
  var mx = (px+6)*s, my = (pz+4.5)*s;
  mctx.strokeStyle = '#ff3b3b'; mctx.lineWidth = 2;
  mctx.beginPath(); mctx.moveTo(mx,my);
  mctx.lineTo(mx+Math.cos(ang)*12, my+Math.sin(ang)*12); mctx.stroke();
  mctx.fillStyle = '#ff3b3b';
  mctx.beginPath(); mctx.arc(mx,my,3.5,0,7); mctx.fill();
}

var roomEl = document.getElementById('room');
function roomName() {
  if (px>1.5 && pz<0) return 'آشپزخانه 🍳';
  if (px>1.5) return 'خواب ۱ 🛏️';
  if (px<-0.5 && pz>0.5) return 'خواب ۲ 🛏️';
  return 'پذیرایی 🏠';
}

var keys = {};
addEventListener('keydown', function(e){ keys[e.key.toLowerCase()] = true; });
addEventListener('keyup', function(e){ keys[e.key.toLowerCase()] = false; });

// نگاه با درگ (موس + لمس) — به‌جز روی جوی‌استیک
var joy = document.getElementById('joy'), stick = document.getElementById('stick');
function inJoy(x, y) {
  var r = joy.getBoundingClientRect();
  return x>=r.left-8 && x<=r.right+8 && y>=r.top-8 && y<=r.bottom+8;
}
var lookId = null, lx = 0;
function lookStart(id, x, y) { if (!inJoy(x,y) && lookId===null) { lookId=id; lx=x; } }
function lookMove(id, x) {
  if (id === lookId) { ang += (x-lx)*0.006; lx = x; }
}
function lookEnd(id) { if (id === lookId) lookId = null; }
var mouseDown = false;
cv.addEventListener('mousedown', function(e){ mouseDown=true; lookStart('m', e.clientX, e.clientY); });
addEventListener('mousemove', function(e){ if (mouseDown) lookMove('m', e.clientX); });
addEventListener('mouseup', function(){ mouseDown=false; lookEnd('m'); });
addEventListener('touchstart', function(e){
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    lookStart(t.identifier, t.clientX, t.clientY);
  }
}, {passive:true});
addEventListener('touchmove', function(e){
  for (var i=0;i<e.changedTouches.length;i++) {
    var t = e.changedTouches[i];
    lookMove(t.identifier, t.clientX);
  }
}, {passive:true});
addEventListener('touchend', function(e){
  for (var i=0;i<e.changedTouches.length;i++) lookEnd(e.changedTouches[i].identifier);
});
addEventListener('touchcancel', function(e){
  for (var i=0;i<e.changedTouches.length;i++) lookEnd(e.changedTouches[i].identifier);
});

// جوی‌استیک با Pointer Events (لمس + موس)
var jx=0, jy=0, joyPid=null;
function joyPos(e) {
  var r = joy.getBoundingClientRect();
  var dx=(e.clientX-(r.left+r.width/2))/(r.width/2-12);
  var dy=(e.clientY-(r.top+r.height/2))/(r.height/2-12);
  var l=Math.hypot(dx,dy)||1;
  if (l>1) { dx/=l; dy/=l; }
  jx=dx; jy=dy;
  var R = r.width/2-25;
  stick.style.left=((r.width-50)/2+dx*R)+'px';
  stick.style.top=((r.height-50)/2+dy*R)+'px';
}
function joyReset() {
  joyPid=null; jx=jy=0;
  stick.style.left='37px'; stick.style.top='37px';
}
joy.addEventListener('pointerdown', function(e){
  joyPid=e.pointerId;
  try { joy.setPointerCapture(e.pointerId); } catch(_){}
  joyPos(e); e.preventDefault();
});
joy.addEventListener('pointermove', function(e){
  if (e.pointerId===joyPid) joyPos(e);
});
joy.addEventListener('pointerup', function(e){
  if (e.pointerId===joyPid) joyReset();
});
joy.addEventListener('pointercancel', function(e){
  if (e.pointerId===joyPid) joyReset();
});

var last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  var dt = Math.min((now-last)/1000, 0.05); last = now;
  var sp = 2.6*dt, f=0, s=0;
  if (keys['w']||keys['arrowup']) f+=1;
  if (keys['s']||keys['arrowdown']) f-=1;
  if (keys['a']||keys['arrowright']) s+=1;
  if (keys['d']||keys['arrowleft']) s-=1;
  f += -jy; s += jx;
  if (f||s) {
    var l = Math.hypot(f,s); f/=Math.max(l,1); s/=Math.max(l,1);
    move((Math.cos(ang)*f - Math.sin(ang)*s)*sp,
         (Math.sin(ang)*f + Math.cos(ang)*s)*sp);
  }
  render();
  var n = roomName();
  if (roomEl.textContent !== n) roomEl.textContent = n;
}
requestAnimationFrame(loop);
</script>
</body>
</html>
